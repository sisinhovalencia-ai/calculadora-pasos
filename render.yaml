# Configuración para publicar en Render (https://render.com): New + → Blueprint → elige este repositorio.
services:
  - type: web
    name: calculadora-pasos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn asgi:app --host 0.0.0.0 --port $PORT --log-level info
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONUNBUFFERED      # que los mensajes aparezcan en el registro al instante
        value: "1"
