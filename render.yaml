# Configuración para publicar en Render (https://render.com): New + → Blueprint → elige este repositorio.
services:
  - type: web
    name: calculadora-pasos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
